<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8C4D2"/></marker></defs>
<text x="0" y="20" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2C3844" text-anchor="start">Historical example: one-line edit in a 2 MiB note</text>
<text x="0" y="40" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7D" text-anchor="start">Recorded transfer sizes; the whole-file baseline is not another product.</text>
<text x="0" y="78" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C3844" text-anchor="start">Whole-file baseline</text>
<text x="0" y="95" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="start">sends the file again</text>
<rect x="200" y="62" width="750" height="30" rx="3" fill="#8FA3B8"/>
<text x="214" y="82" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C3844" text-anchor="start">2.0 MiB</text>
<text x="0" y="130" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C3844" text-anchor="start">Trew</text>
<text x="0" y="147" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="start">changed chunks and metadata</text>
<rect x="200" y="114" width="7.9" height="30" rx="1.5" fill="#4B5C70"/>
<text x="216" y="134" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C3844" text-anchor="start">21.7 KiB</text>
<path d="M200,150 L200,190" stroke="#B8C4D2" stroke-width="1" />
<path d="M207.9,150 L950,190" stroke="#B8C4D2" stroke-width="1" stroke-dasharray="3 3"/>
