<text x="218" y="251" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7D" text-anchor="start">12.7 KiB, changed chunk content</text>
<rect x="638.9" y="242" width="10" height="10" rx="2" fill="#8FA3B8"/>
<text x="656.9400921658987" y="251" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7D" text-anchor="start">9.0 KiB, the entry</text>
<text x="0" y="292" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7D" text-anchor="start">Entry metadata names every chunk and limits the saving. Results depend on the file and edit.</text>
<text x="0" y="310" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7D" text-anchor="start">See docs/research.md for the historical method and limits; this is not a current-release benchmark.</text>
