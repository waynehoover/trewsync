<text x="0" y="237" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7D" text-anchor="start">magnified about 95 times</text>
<rect x="200" y="200" width="438.9" height="30" rx="3" fill="#4B5C70"/>
