# Telimus on a homelab.
#
# No TLS here on purpose: no key material lives in this binary. Put
# `tailscale serve`, Caddy or a tunnel in front, and leave this published only
# where that can reach it.
#
# To run from source instead of the published image, replace `image:` with
#   build: { context: ., args: { VERSION: dev } }

services:
  telimus:
    # Pinned to a release and to its digest, so `docker compose pull` cannot
    # quietly move you to an image nobody tested against your devices. To
    # upgrade, change both, and change the server before the clients. The
    # server speaks one protocol version today and refuses anything else at
    # hello, naming both numbers, so a client upgraded first simply cannot
    # connect until the server catches up.
    #
    # The tag is the newest *server* release, which is not the plugin's
    # version: the image is built on a `server/v*` tag, and a client-only
    # release moves the plugin without moving the server. Checked by
    # .github/workflows/ci.yml, which reads the newest server tag rather
    # than a manifest, because comparing against the plugin version would
    # fail every client-only release for no reason.
    #
    # The digest came from:
    #   docker buildx imagetools inspect ghcr.io/waynehoover/telimus:0.9.0
    image: ghcr.io/waynehoover/telimus:0.9.0@sha256:47180045d70e77ec2e20ccf0666bee4daea1146cfd37f68d587d0dced75d6c2b
    container_name: telimus
    restart: unless-stopped

    # Long enough for the server's own shutdown to finish (I17).
    #
    # A stop drains in two halves with five seconds each: the listener and its
    # ordinary requests, then the sessions, where a put that has already stored
    # its bodies is allowed to reach its commit and its ack. Then the store is
    # closed. Docker's default grace is ten seconds, which is exactly the two
    # halves and nothing at all for closing the store, so a busy shutdown was
    # killed partway through one. Nothing is lost when that happens, because an
    # unacked put is retried and SQLite's write-ahead log recovers, but "the
    # deadline is exactly the budget" is not a margin.
    #
    # Thirty, matching TimeoutStopSec in the systemd unit `telimus service`
    # writes, so a stop behaves the same whichever way this is run.
    # TestEveryStopDeadlineOutlastsTheShutdownBudget keeps the three numbers in
    # step.
    stop_grace_period: 30s

    # 127.0.0.1 rather than every interface. Something in front terminates TLS
    # and reaches this; nothing else should be able to.
    ports:
      - "127.0.0.1:3003:3003"

    volumes:
      - telimus-data:/data

    # The image's default is `serve -addr 0.0.0.0:3003`. Override it here to
    # add a flag, which is the only place a flag can go under compose. The one
    # that comes up is the file ceiling: `serve` refuses to start with a
    # -max-file below a live file the vault already holds, and a vault that
    # took a large attachment under a raised ceiling needs the same ceiling
    # again. It is in bytes, with no suffixes.
    #
    # command: ["serve", "-addr", "0.0.0.0:3003", "-max-file", "134217728"]

    # The image already drops to 65532. These say the rest of it out loud, so a
    # compose file somebody copies keeps the properties the image was built for.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # The line to paste into your first device is in here, once:
    #   docker compose logs telimus | grep '#'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telimus-data:
