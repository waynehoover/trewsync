# TrewSync on a homelab.
#
# No TLS here on purpose: no key material lives in this binary. Put
# `tailscale serve`, Caddy or a tunnel in front, and leave this published only
# where that can reach it.
#
#   docker compose up -d --build
#
# One port, 3003, for everything: devices sync over it, and with -mcp in the
# command below agents reach the MCP endpoint at /mcp on the same origin.

services:
  trew:
    # A published image is pinned to its release and to its digest, so
    # `docker compose pull` cannot quietly move you to an image nobody tested
    # against your devices. The tag is the newest *server* release, which is
    # not the plugin's version: the image is built on a `server/v*` tag, and a
    # client-only release moves the plugin without moving the server.
    # scripts/pin-compose.sh writes the pin and scripts/pin-check.sh fails
    # when it is behind. Upgrade the server before the clients: it refuses a
    # protocol it does not speak at hello, naming both numbers, so a client
    # upgraded first cannot connect until the server catches up.
    # The digest came from:
    #   docker buildx imagetools inspect ghcr.io/waynehoover/trewsync:0.12.1
    image: ghcr.io/waynehoover/trewsync:0.12.1@sha256:5126eb1b9780522eb21d5286f0327268995280dca3440d6eb002733f559a2248
    container_name: trew
    restart: unless-stopped

    # Long enough for the server's own shutdown to finish (I17).
    #
    # A stop drains in two halves with five seconds each: the listener and its
    # ordinary requests, then the sessions, where a put that has already stored
    # its bodies is allowed to reach its commit and its ack. Then the store is
    # closed. Docker's default grace is ten seconds, which is exactly the two
    # halves and nothing at all for closing the store, so a busy shutdown was
    # killed partway through one. Nothing is lost when that happens, because an
    # unacked put is retried and SQLite's write-ahead log recovers, but "the
    # deadline is exactly the budget" is not a margin.
    #
    # Thirty, matching TimeoutStopSec in the systemd unit `trewd service`
    # writes, so a stop behaves the same whichever way this is run.
    # TestEveryStopDeadlineOutlastsTheShutdownBudget keeps the three numbers in
    # step.
    stop_grace_period: 30s

    # 127.0.0.1 rather than every interface. Something in front terminates TLS
    # and reaches this; nothing else should be able to.
    ports:
      - "127.0.0.1:3003:3003"

    volumes:
      - trew-data:/data

    # The image's default is `serve -addr 0.0.0.0:3003`, without MCP. This adds
    # -mcp, which serves the MCP endpoint at /mcp beside sync on the same port,
    # for agents holding a token from `trewd mcp-token`; it answers nobody
    # until a token exists. Remove it to serve devices only.
    #
    # This is the only place a flag can go under compose. The other one that
    # comes up is the file ceiling: `serve` refuses to start with a -max-file
    # below a live file the vault already holds, and a vault that took a large
    # attachment under a raised ceiling needs the same ceiling again. It is in
    # bytes, with no suffixes:
    #
    #   command: ["serve", "-addr", "0.0.0.0:3003", "-mcp", "-max-file", "134217728"]
    command: ["serve", "-addr", "0.0.0.0:3003", "-mcp"]

    # The image already drops to 65532. These say the rest of it out loud, so a
    # compose file somebody copies keeps the properties the image was built for.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # The first device pairs from an invite. `serve` writes one to
    # /data/first-invite, mode 0600, and logs only where it is and when it
    # expires, never the string. Behind a TLS proxy that invite names addresses
    # no device can reach, so make one naming the address devices do use:
    #   docker compose exec trew /trewd invite -url wss://homelab.example.ts.net
    #
    # And an agent's token for /mcp, which reads the whole vault:
    #   docker compose exec trew /trewd mcp-token -label "Claude on Mac"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  trew-data:
